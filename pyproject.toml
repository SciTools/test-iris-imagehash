[tool.mypy]
# https://mypy.readthedocs.io/en/stable/error_code_list2.html
disable_error_code = [] # Include any error codes that you want to ignore
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]
exclude = [
    "^run_test\\.py$",
]
ignore_missing_imports = true
strict = true
warn_unreachable = true
warn_unused_configs = true

[tool.numpydoc_validation]
# https://numpydoc.readthedocs.io/en/latest/validation.html#validation-checks
checks = [
    "all",  # Enable all numpydoc validation rules, apart from the following:

    # -> Docstring text (summary) should start in the line immediately
    #    after the opening quotes (not in the same line, or leaving a
    #    blank line in between)
    # Reason for ignore: A chosen house-style
    "GL01",  # Permit summary line on same line as docstring opening quotes.

    # -> Closing quotes should be placed in the line after the last text
    #    in the docstring (do not close the quotes in the same line as
    #    the text, or leave a blank line between the last text and the
    #    quotes)
    # Reason for ignore: A chosen house-style
    "GL02",  # Permit a blank line before docstring closing quotes.

    # -> Double line break found; please use only one blank line to
    #    separate sections or paragraphs, and do not leave blank lines
    #    at the end of docstrings
    # Reason for ignore: We benefit from more flexability in formatting
    "GL03",  # Ignoring.

    # -> See Also section not found
    "SA01",  # Not all docstrings require a "See Also" section.

    # -> No extended summary found
    "ES01",  # Not all docstrings require an "Extended Summary" section.

    # -> No examples section found
    "EX01",  # Not all docstrings require an "Examples" section.

    # -> No Yields section found
    "YD01",  # Not all docstrings require a "Yields" section.
]
exclude = [
    '\.__eq__$',
    '\.__ne__$',
    '\.__repr__$',
]

[tool.pytest.ini_options]
# configure settings as recommended by repo-review:
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["default"]
log_cli = "True"
log_cli_level = "INFO"
log_level = "INFO"
minversion = "6.0"
testpaths = "./run_test.py"
xfail_strict = "True"

[tool.repo-review]
# We have agreed that we will permanently ignore the repo-review rules in the first half of this ignore list.
ignore = [
    # https://learn.scientific-python.org/development/guides/style/#PC180
    # Not possible to run on the hardware used by the majority of our developers. Might change in future!
    "PC180", # Uses prettier.
    # https://learn.scientific-python.org/development/guides/packaging-simple#PP006
    "PP006",  # Uses dev dependency group

    # https://learn.scientific-python.org/development/guides/style/#PC170
    "PC170",  # Uses PyGrep hooks

    # test-iris-imagehash is very simple, and not a package, which exempts the
    #  following rules.
    # https://learn.scientific-python.org/development/guides/style/#PP002
    "PP002",  # Build-system
    # https://learn.scientific-python.org/development/guides/style/#PP003
    "PP003",  # Wheel dependency
    # https://learn.scientific-python.org/development/guides/packaging-simple/#package-structure
    "PY005",  # tests folder
    # https://learn.scientific-python.org/development/guides/style/#PY004
    "PY004",  # Docs folder
    # https://learn.scientific-python.org/development/guides/style/#PY007
    "PY007",  # Nox/tox
    # https://learn.scientific-python.org/development/guides/style/#RF003
    "RF003",  # Ruff src directory
    # https://learn.scientific-python.org/development/guides/docs/#readthedocsyaml
    "RTD",    # ReadTheDocs

    # TODO: exceptions that still need investigating are below. Might be fixable, or might become permanent (above):

    # https://learn.scientific-python.org/development/guides/gha-basic/
    "GH",     # TODO: switch to GitHub Actions
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.format]
preview = false

[tool.ruff.lint]
# We have agreed that we will permanently ignore the ruff rules in the first half of this ignore list.
ignore = [
    # flake8-commas (COM)
    # https://docs.astral.sh/ruff/rules/#flake8-commas-com
    "COM812",  # Trailing comma missing.
    "COM819",  # Trailing comma prohibited.

    # flake8-implicit-str-concat (ISC)
    # https://docs.astral.sh/ruff/rules/single-line-implicit-string-concatenation/
    # NOTE: This rule may cause conflicts when used with "ruff format".
    "ISC001",  # Implicitly concatenate string literals on one line.
]
preview = false
select = [
    "ALL",
    # Note: the above "all" disables conflicting rules, if you want that
    # rule it needs to be explicitly enabled below:
    "D212",  # Multi-line docstring summary should start at the first line
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["iris"]

[tool.ruff.lint.per-file-ignores]
# All test scripts
"run_test.py" = [
    # https://docs.astral.sh/ruff/rules
    "D100",  # Missing docstring in public module
    "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D205",  # 1 blank line required between summary line and description
    "D401",  # 1 First line of docstring should be in imperative mood

    "ANN",   # https://docs.astral.sh/ruff/rules/#flake8-annotations-ann
    "S101",  # Use of assert detected
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
